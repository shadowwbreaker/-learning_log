{% extends "base.html" %}

{% block content %}
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <h2>Log in</h2>
            <form method="post" action="{% url 'users:login' %}">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit">Log in</button>
            </form>
            <p>Don't have an account? <a href="{% url 'users:register' %}">Register</a>.</p>
        </div>
    </div>
{% endblock content %}
