{% extends "base.html" %}

{% block content %}
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <h2>Register</h2>
            <form method="post" action="{% url 'users:register' %}">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit">Register</button>
            </form>
            <p>Already have an account? <a href="{% url 'users:login' %}">Log in</a>.</p>
        </div>
    </div>
{% endblock content %}
