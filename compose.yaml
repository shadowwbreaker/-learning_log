services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && gunicorn learning_log.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
    volumes:
      - sqlite_data:/app/data
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  sqlite_data:
